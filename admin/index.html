<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atirath Holdings - Content Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a6b12 0%, #2E9E1F 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: white;
            border-radius: 24px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
        }
        .logo {
            margin-bottom: 30px;
        }
        .logo img {
            max-width: 180px;
            height: auto;
        }
        h1 {
            font-size: 1.8rem;
            color: #1a2a1a;
            margin-bottom: 10px;
        }
        p {
            color: #5a6b58;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            background: #2E9E1F;
            color: white;
            padding: 12px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #1a6b12;
            transform: translateY(-2px);
        }
        .info {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            font-size: 0.8rem;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <img src="../logo.svg" alt="Atirath Holdings" onerror="this.src='https://placehold.co/180x60/2E9E1F/white?text=ATIRATH'">
        </div>
        <h1>Content Manager</h1>
        <p>Login to manage your website content - Blog, Careers, Gallery, Team & more</p>
        <a href="#" class="btn" id="loginBtn">
            <i class="fas fa-sign-in-alt" style="margin-right: 8px;"></i> Login with Netlify Identity
        </a>
        <div class="info">
            ⚡ Need access? Contact your administrator
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/js/all.min.js"></script>
    <script>
        document.getElementById('loginBtn').addEventListener('click', function(e) {
            e.preventDefault();
            // This will be handled by Netlify Identity
            if (typeof netlifyIdentity !== 'undefined') {
                netlifyIdentity.open();
            } else {
                alert('Please deploy this site on Netlify to use the CMS. For local testing, use Netlify Dev.');
            }
        });
    </script>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</body>
</html>
